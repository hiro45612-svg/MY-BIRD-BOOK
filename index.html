<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY BIRD BOOK — 復旧用 INDEX</title>
</head>
<body>
<p style="font-family:system-ui;padding:24px;line-height:1.7">🐦 MY BIRD BOOKを復旧しています…</p>
<script>
(async () => {
  // 差し替え直前の index.html をそのまま読み込みます。追加修正は行いません。
  const SOURCE = "https://raw.githubusercontent.com/hiro45612-svg/MY-BIRD-BOOK/9ad8032d3161441df50036562892fdb77da9e905/index.html";
  try {
    const response = await fetch(SOURCE, { cache: "no-store" });
    if (!response.ok) throw new Error("差し替え前のINDEXを取得できませんでした (" + response.status + ")");
    const html = await response.text();
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML =
      '<main style="font-family:system-ui;padding:24px;line-height:1.8">' +
      '<h2>🐦 MY BIRD BOOKを読み込めませんでした</h2>' +
      '<p>通信状態を確認してください。データを削除したり初期化したりしないでください。</p>' +
      '<p id="err" style="color:#777;overflow-wrap:anywhere"></p></main>';
    document.getElementById("err").textContent = String(error.message || error);
  }
})();
</script>
</body>
</html>
