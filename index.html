<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY BIRD BOOK v2.0</title>
<script>
/*
 * MY BIRD BOOK — localStorage容量対策版
 * 元のアプリ本体は、現在の安定版コミットから読み込みます。
 * 写真がSupabase Storageに保存済み(photoPathあり)の場合、
 * ブラウザ側には写真本体(base64)を保存しないようにします。
 */
(async()=>{
  const SOURCE="https://raw.githubusercontent.com/hiro45612-svg/MY-BIRD-BOOK/f2f02ee59abca0d012ab4006b027ff76966b136d/index.html";
  const KEY="myBirdBook_v02";

  function compact(value){
    try{
      const obj=JSON.parse(value);
      if(!obj || !Array.isArray(obj.birds)) return value;
      obj.birds.forEach(b=>{
        if(b && b.photoPath){
          b.photo="";
          b._photoUrl="";
        }
      });
      return JSON.stringify(obj);
    }catch(e){
      return value;
    }
  }

  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    if(key===KEY) value=compact(value);
    return originalSetItem.call(this,key,value);
  };

  /* すでに残っている巨大な写真データも、photoPathがあるものだけ整理 */
  try{
    const old=localStorage.getItem(KEY);
    if(old){
      const small=compact(old);
      if(small!==old) originalSetItem.call(localStorage,KEY,small);
    }
  }catch(e){
    console.warn("MY BIRD BOOK localStorage cleanup:",e);
  }

  try{
    const res=await fetch(SOURCE,{cache:"no-store"});
    if(!res.ok) throw new Error("元アプリを読み込めませんでした");
    let html=await res.text();

    const patch=`
<script>
/* localStorage容量対策は親ページ側ですでに設定済みです。 */
<\/script>`;

    html=html.replace('data.birds.filter(b=>b.photo).length','data.birds.filter(b=>b.photo||b.photoPath).length');
    html=html.replace("</head>",patch+"\\n</head>");
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML=
      '<div style="font-family:system-ui;padding:30px;line-height:1.8">'+
      '<h2>🐦 MY BIRD BOOKを読み込めませんでした</h2>'+
      '<p>インターネット接続を確認して、ページを再読み込みしてください。</p>'+
      '<p style="color:#777">'+String(e.message||e)+'</p>'+
      '</div>';
  }
})();
</script>
</head>
<body>
<p style="font-family:system-ui;padding:30px">🐦 MY BIRD BOOKを読み込んでいます…</p>
</body>
</html>
