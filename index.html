<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY BIRD BOOK v2.0</title>
<script>
/*
 * MY BIRD BOOK — localStorage容量対策版
 * 元のアプリ本体は、現在の安定版コミットから読み込みます。
 * 写真がSupabase Storageに保存済み(photoPathあり)の場合、
 * ブラウザ側には写真本体(base64)を保存しないようにします。
 */
(async()=>{
  const SOURCE="https://raw.githubusercontent.com/hiro45612-svg/MY-BIRD-BOOK/f2f02ee59abca0d012ab4006b027ff76966b136d/index.html";
  const KEY="myBirdBook_v02";

  function compact(value){
    try{
      const obj=JSON.parse(value);
      if(!obj || !Array.isArray(obj.birds)) return value;
      obj.birds.forEach(b=>{
        if(b && b.photoPath){
          b.photo="";
          b._photoUrl="";
        }
      });
      return JSON.stringify(obj);
    }catch(e){
      return value;
    }
  }

  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    if(key===KEY) value=compact(value);
    return originalSetItem.call(this,key,value);
  };

  /* すでに残っている巨大な写真データも、photoPathがあるものだけ整理 */
  try{
    const old=localStorage.getItem(KEY);
    if(old){
      const small=compact(old);
      if(small!==old) originalSetItem.call(localStorage,KEY,small);
    }
  }catch(e){
    console.warn("MY BIRD BOOK localStorage cleanup:",e);
  }

  try{
    const res=await fetch(SOURCE,{cache:"no-store"});
    if(!res.ok) throw new Error("元アプリを読み込めませんでした");
    let html=await res.text();
    if(!html.includes("<div class=\"actions\"><button class=\"btn secondary\" id=\"birdCancel\">キャンセル</button><button class=\"btn\" id=\"birdSave\">保存</button></div>")) throw new Error('修正対象が見つかりません');
    html=html.replace("<div class=\"actions\"><button class=\"btn secondary\" id=\"birdCancel\">キャンセル</button><button class=\"btn\" id=\"birdSave\">保存</button></div>","<div class=\"field\"><button type=\"button\" class=\"btn secondary\" id=\"deleteBirdBtn\" style=\"display:none;background:#f8e5e3;color:#8b2923\">🗑️ この野鳥の登録を削除</button><div class=\"meta\">登録全体と写真・メモも削除します。操作前に確認が表示されます。</div></div><div class=\"actions\"><button class=\"btn secondary\" id=\"birdCancel\">キャンセル</button><button class=\"btn\" id=\"birdSave\">保存</button></div>");
    if(!html.includes("d.birds=(d.birds||[]).map((b,i)=>({...b,id:b.id||\"b\"+i,places:Array.isArray(b.places)?b.places:[],photo:b.photo||\"\",photoPath:b.photoPath||\"\",photoUpdatedAt:Number(b.photoUpdatedAt||b.updatedAt||0),photoDeletedAt:Number(b.photoDeletedAt||0),updatedAt:Number(b.updatedAt||0)}));")) throw new Error('修正対象が見つかりません');
    html=html.replace("d.birds=(d.birds||[]).map((b,i)=>({...b,id:b.id||\"b\"+i,places:Array.isArray(b.places)?b.places:[],photo:b.photo||\"\",photoPath:b.photoPath||\"\",photoUpdatedAt:Number(b.photoUpdatedAt||b.updatedAt||0),photoDeletedAt:Number(b.photoDeletedAt||0),updatedAt:Number(b.updatedAt||0)}));","d.deletedBirdIds=Array.isArray(d.deletedBirdIds)?d.deletedBirdIds:[];\n d.birds=(d.birds||[]).filter(b=>!d.deletedBirdIds.includes(b.id)).map((b,i)=>({...b,id:b.id||\"b\"+i,places:Array.isArray(b.places)?b.places:[],photo:b.photo||\"\",photoPath:b.photoPath||\"\",photoUpdatedAt:Number(b.photoUpdatedAt||b.updatedAt||0),photoDeletedAt:Number(b.photoDeletedAt||0),updatedAt:Number(b.updatedAt||0)}));");
    if(!html.includes("return {birds:mergeList(a.birds,b.birds),places:mergeList(a.places,b.places)};")) throw new Error('修正対象が見つかりません');
    html=html.replace("return {birds:mergeList(a.birds,b.birds),places:mergeList(a.places,b.places)};","const deletedBirdIds=[...new Set([...(a.deletedBirdIds||[]),...(b.deletedBirdIds||[])])];\n return {birds:mergeList(a.birds,b.birds).filter(x=>!deletedBirdIds.includes(x.id)),places:mergeList(a.places,b.places),deletedBirdIds};");
    if(!html.includes("function editBird(id){let b=data.birds.find(x=>x.id===id);window.editingBird=id;birdModalTitle.textContent=b?\"鳥を編集\":\"鳥を追加\";")) throw new Error('修正対象が見つかりません');
    html=html.replace("function editBird(id){let b=data.birds.find(x=>x.id===id);window.editingBird=id;birdModalTitle.textContent=b?\"鳥を編集\":\"鳥を追加\";","async function deleteBirdRecord(){\n const id=window.editingBird;const b=data.birds.find(x=>x.id===id);if(!b)return;\n if(!confirm(\"「\"+b.鳥名+\"」の登録全体を削除します。写真・メモ・行先との関連も削除されます。この操作は元に戻せません。よろしいですか？\"))return;\n try{\n  if(currentUser&&b.photoPath){const path=storagePathFromPhotoPath(b.photoPath);if(path){const {error}=await supabaseClient.storage.from(PHOTO_BUCKET).remove([path]);if(error)throw error;photoUrlCache.delete(path)}}\n  data.birds=data.birds.filter(x=>x.id!==id);data.deletedBirdIds=[...new Set([...(data.deletedBirdIds||[]),id])];\n  localStorage.setItem(KEY,JSON.stringify(data));if(currentUser)await pushCloud();render();closeModal(\"birdModal\");\n }catch(e){alert(\"登録の削除・同期に失敗しました。\\\\n\"+e.message+\"\\\\n\\\\n登録は削除処理を完了できませんでした。通信状態を確認して再度お試しください。\")}\n}\nfunction editBird(id){let b=data.birds.find(x=>x.id===id);window.editingBird=id;document.getElementById(\"deleteBirdBtn\").style.display=b?\"\":\"none\";birdModalTitle.textContent=b?\"鳥を編集\":\"鳥を追加\";");
    if(!html.includes("addBird.onclick=()=>editBird(null);addPlace.onclick=()=>editPlace(null);")) throw new Error('修正対象が見つかりません');
    html=html.replace("addBird.onclick=()=>editBird(null);addPlace.onclick=()=>editPlace(null);","addBird.onclick=()=>editBird(null);addPlace.onclick=()=>editPlace(null);deleteBirdBtn.onclick=deleteBirdRecord;");
    
    const patch=`
<script>
/* localStorage容量対策は親ページ側ですでに設定済みです。 */
<\/script>`;

    html=html.replace('data.birds.filter(b=>b.photo).length','data.birds.filter(b=>b.photo||b.photoPath).length');
    html=html.replace("</head>",patch+"\\n</head>");
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML=
      '<div style="font-family:system-ui;padding:30px;line-height:1.8">'+
      '<h2>🐦 MY BIRD BOOKを読み込めませんでした</h2>'+
      '<p>インターネット接続を確認して、ページを再読み込みしてください。</p>'+
      '<p style="color:#777">'+String(e.message||e)+'</p>'+
      '</div>';
  }
})();
</script>
</head>
<body>
<p style="font-family:system-ui;padding:30px">🐦 MY BIRD BOOKを読み込んでいます…</p>
</body>
</html>
