  function compact(value){
    try{
      const obj=JSON.parse(value);
      if(!obj || !Array.isArray(obj.birds)) return value;
      obj.birds.forEach(b=>{
        if(b && b.photoPath){ b.photo=""; b._photoUrl=""; }
        if(b && Array.isArray(b.extraPhotos)) b.extraPhotos.forEach(ph=>{

        });
      });
      return JSON.stringify(obj);
    }catch(e){
      return value;
    }
  }

  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    if(key===KEY) value=compact(value);
    return originalSetItem.call(this,key,value);
  };

  /* すでに残っている巨大な写真データも、photoPathがあるものだけ整理 */
  try{
    const old=localStorage.getItem(KEY);

      if(small!==old) originalSetItem.call(localStorage,KEY,small);
    }

    html=html.replace('{label:"代表写真",src:b._photoUrl||b.photo||b.photoPath}', '{label:b.photoLabel||"その他",src:b._photoUrl||b.photo||b.photoPath}');

    // v2.7: クラウドから取得した追加写真のURLを、手動同期後にも解決する。
    html=html.replace('   await pushCloud();\n   render();\n   if(migrated)setStatus', '   await pushCloud();\n   await hydrateCloudPhotos();\n   render();\n   if(migrated)setStatus');

    // v2.7: 写真一覧を開いた時もStorage URLを解決してから表示する。
    html=html.replace('function renderExtraPhotosEditor(b){\n const box=document.getElementById("currentExtraPhotos"); if(!box)return;\n const photos=(b?.extraPhotos||[]).filter(ph=>!ph.deletedAt);\n box.innerHTML=', 'async function renderExtraPhotosEditor(b){\n const box=document.getElementById("currentExtraPhotos"); if(!box)return;\n const photos=(b?.extraPhotos||[]).filter(ph=>!ph.deletedAt);\n if(currentUser){for(const ph of photos){if(ph.photoPath&&!ph._photoUrl){try{ph._photoUrl=await getCloudPhotoUrl(ph)}catch(e){console.warn("extra photo URL load failed",e.message)}}}}\n box.innerHTML=');

    // v2.7: アップロード済みの追加写真はStorage URLで表示し、余分なbase64を保持しない。
    html=html.replace('if(currentUser){ph.photoPath=await uploadPhoto(b.id+"_"+ph.id,resizedExtra,"");ph._photoUrl=await getCloudPhotoUrl(ph);}', 'if(currentUser){ph.photoPath=await uploadPhoto(b.id+"_"+ph.id,resizedExtra,"");ph._photoUrl=await getCloudPhotoUrl(ph);}');

    // v2.7: REBOOT出力にも代表写真の区分を記録する。
    html=html.replace('- 写真：${((b.photo||b.photoPath)||(b.extraPhotos||[]).some(ph=>!ph.deletedAt&&(ph.photo||ph.photoPath)))?"あり":"なし"}\\n- 追加写真：', '- 写真：${((b.photo||b.photoPath)||(b.extraPhotos||[]).some(ph=>!ph.deletedAt&&(ph.photo||ph.photoPath)))?"あり":"なし"}（区分：${b.photoLabel||"その他"}）\\n- 追加写真：');

    const patch=`
<script>

    html=html.replace('data.birds.filter(b=>b.photo).length','data.birds.filter(b=>b.photo||b.photoPath).length');
